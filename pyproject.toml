[project]
name = "nl_dpe"
version = "0.0.1"
description = "Non-Linear Dot Product Engine (NL-DPE)"
authors = [{ name = "Hewlett Packard Labs" }]
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "pandas>=2.2.0",
    "torch>=2.2.0",
    "tqdm>=4.66.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "mlflow-skinny>=2.14.0",
    "jaxtyping>=0.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pre-commit==3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = 'py310'
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "F722" # jaxtyping fix (https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error)
]

[tool.taskipy.tasks]
"download-mrpc" = """
mkdir -p ./datasets/mrpc && cd ./datasets/mrpc &&
wget https://dl.fbaipublicfiles.com/senteval/senteval_data/msr_paraphrase_train.txt &&
wget https://dl.fbaipublicfiles.com/senteval/senteval_data/msr_paraphrase_test.txt
"""

"download-glue" = """
uv run --no-sync python ./nl_dpe/download_glue_data.py --data_dir=./datasets/glue --tasks=all --path_to_mrpc ./datasets/mrpc
"""

"eval-sst2" = """
uv run python ./nl_dpe/evaluate.py sst-2 ./models/wise-tern-584/ ./datasets/glue/SST-2
"""

"eval-cola" = """
uv run python ./nl_dpe/evaluate.py cola ./models/blushing-dove-984/ ./datasets/glue/CoLA
"""

"eval-mrpc" = """
uv run python ./nl_dpe/evaluate.py mrpc ./models/spiffy-snake-501/ ./datasets/glue/MRPC
"""